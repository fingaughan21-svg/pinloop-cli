name: HillBagger
options:
  bundleIdPrefix: com.example.hillbagger
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HillBagger:
    type: application
    platform: iOS
    sources:
      - HillBagger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hillbagger
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HillBagger
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: HillBagger uses your location to show the nearest hills you haven't bagged yet.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
  HillBaggerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HillBaggerTests
    dependencies:
      - target: HillBagger
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HillBagger:
    build:
      targets:
        HillBagger: all
        HillBaggerTests: [test]
    test:
      targets:
        - HillBaggerTests
