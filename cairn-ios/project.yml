name: Cairn
options:
  bundleIdPrefix: com.example.cairn
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Cairn:
    type: application
    platform: iOS
    sources:
      - Cairn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cairn
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cairn
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Cairn uses your location to show the nearest hills you haven't bagged yet.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
  CairnTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CairnTests
    dependencies:
      - target: Cairn
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Cairn:
    build:
      targets:
        Cairn: all
        CairnTests: [test]
    test:
      targets:
        - CairnTests
